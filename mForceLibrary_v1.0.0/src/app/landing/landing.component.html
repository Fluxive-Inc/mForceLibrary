<div class="perimeter-wrapper">
    <!-- Standard Header -->
    <header class="site-header">
        <div class="header-left">
            <span class="brand-text">FLUXIVE <span class="highlight">INTELLIGENT BEYOND ARTIFICIAL</span></span>
        </div>
        <div class="header-right">
            <span class="built-with">BUILT WITH</span>
            <span class="cloud-text">Google Cloud STARTUPS</span>
        </div>
    </header>

    <!-- Background Ambient Glow -->
    <div class="ambient-glow"></div>

    <!-- Center Box with Glass Effect -->
    <div class="glass-panel">
        <!-- Top Glow Line -->
        <div class="glow-line"></div>

        <!-- Vision Mark -->
        <div class="vision-mark">
            <span>fluXive<sup>OS</sup></span>
        </div>

        <!-- Icon -->
        <div class="icon-container">
            <div class="icon-glow"></div>
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="main-icon">
                <path
                    d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20 M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z">
                </path>
            </svg>
        </div>

        <!-- Title & Subtitle -->
        <h1 class="main-title">FLUXIVE LIBRARY</h1>
        <div class="sub-title">
            <div class="pulse-dot"></div>
            <span>AN IMMERSIVE DATA THEATER</span>
        </div>

        <button class="btn-enter" (click)="enterLibrary()">ENTER NEXUS</button>
    </div>

    <!-- Footer Ticker -->
    <footer class="ticker-bar">
        <div class="build-stamp">BUILD 2026.02.20.1000</div>
        <div class="copyright">&copy; 2026 Fluxive Inc</div>
    </footer>
</div>
