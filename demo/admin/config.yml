backend:
  name: github
  repo: fluxive/fxAgent_mForceDocs
  branch: main
  base_url: https://fxagent-oauth-xsrdjrvkxq-ue.a.run.app

media_folder: "docs/public/images"
public_folder: "/images"

collections:
  - name: "guide"
    label: "Guide"
    folder: "docs/guide"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "studio"
    label: "Studio"
    folder: "docs/studio"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
